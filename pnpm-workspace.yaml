packages:
  - 'apps/*'
  - 'packages/*'

# The virtual store lives in a .nosync folder so iCloud Drive never syncs or evicts it
# when the project sits inside a synced folder (harmless elsewhere).
virtualStoreDir: .pnpm.nosync

# Packages allowed to run install/postinstall scripts (native builds, engine downloads).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
